<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Infinite Gallery — Fixed</title>

<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#080808;
    --text:#ffffff;
    --font: Helvetica;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    height:100vh;
    width:100vw;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    overflow:hidden;
    cursor:grab;
    user-select:none;
    -webkit-font-smoothing:antialiased;
     /* Critical for custom drag */
  }
  body.dragging{cursor:grabbing}

  /* ---------- Video background (local file: video.mp4) ---------- */
  #video-bg{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
    pointer-events:none;
    background:black;
    opacity:0.12;
  }
  #video-bg video {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    object-fit:cover;
    pointer-events:none;
  }

  /* ---------- UI frame ---------- */
  .frame{
    position:fixed; left:0; top:0; width:100%; padding:14px; z-index:50; pointer-events:none;
    mix-blend-mode:difference;
    font-weight:700; letter-spacing:3px;
  }
  .frame__title{ font-size:0.88rem; }

  /* ---------- Start Overlay ---------- */
  #start-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    transition: opacity 0.6s ease, visibility 0.6s;
    cursor: grab;
    pointer-events: auto;
  }
  #start-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  
  .start-icon {
    width: 64px;
    height: 64px;
    margin-bottom: 24px;
    opacity: 0.9;
    color: white;
    animation: iconPulse 2.5s infinite ease-in-out;
  }
  
  .start-text {
    font-family: var(--font);
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    font-weight: 700;
    text-transform: uppercase;
    opacity: 0.8;
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  /* ---------- Gallery container ---------- */
  #grid-container{
    position:fixed;
    inset:0;
    z-index:0;
    will-change:transform;
    pointer-events:auto;
  }

  .item{
    position:absolute;
    visibility:hidden;
    will-change:transform,opacity;
    transform:translateZ(0);
  }
  .item.is-visible{ visibility:visible; }

  .item-wrapper{
    position:relative;
    overflow:visible;
    border-radius:6px;
    outline:1px solid rgba(255,255,255,0.04);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 2px 4px rgba(0,0,0,0.25);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:#111;
  }

  .item-image{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    border-radius:6px;
    pointer-events:none;
    opacity: 0;
    transition: opacity 0.4s ease-in;
  }
  .item-image.loaded {
    opacity: 1;
  }

  @media (hover:hover){
    .item:hover .item-wrapper{ transform:scale(1.02); transition:transform .28s; box-shadow:0 10px 28px rgba(0,0,0,0.55); }
  }

  /* ---------- Focus overlay ---------- */
  .focus-overlay{
    position:fixed; inset:0; z-index:1200;
    background:rgba(0,0,0,0.92);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .focus-overlay.active{ opacity:1; pointer-events:auto; }

  .focus-img{
    max-width:92vw;
    max-height:92vh;
    width:auto; height:auto;
    object-fit:contain;
    border-radius:6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.75);
    transform-origin: center center;
    will-change: transform;
    cursor: grab;
  }
  .focus-img:active {
    cursor: grabbing;
  }

  .focus-close{
    position:fixed; top:18px; right:18px; z-index:1300;
    background:none; border:none; color:white; font-family:var(--font); cursor:pointer;
    padding: 14px; /* larger tap target */
    font-size: 1rem;
    mix-blend-mode: difference;
  }


/* Rotating typewriter title styling */
.rotating-title {
  font-size: 1.25rem !important; /* requested size */
  font-weight: 600;
  display: inline-block;
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
  direction: ltr; /* will be toggled by script based on language */
  text-align: left;
}
.rotating-title .text-inner{ display:inline-block; }
.rotating-title .caret {
  display: inline-block;
  width: .1em;
  margin-left: .08em;
  animation: blink-caret 1s step-end infinite;
  vertical-align: bottom;
  font-weight: 600;
}
@keyframes blink-caret {
  from, to { opacity: 0; }
  50% { opacity: 1; }
}



/* Book floating button + modal styles */
.book-button{
  position: fixed;
  right: 26px;
  bottom: 26px;
  z-index: 1200;
  border: none;
  background: linear-gradient(135deg,#7b61ff 0%, #45c8ff 100%);
  color: white;
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 8px 24px rgba(70,90,180,0.18), 0 2px 6px rgba(0,0,0,0.12);
  cursor: pointer;
  transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s;
  backdrop-filter: blur(6px) saturate(1.1);
}
.book-button:active { transform: scale(.98); }
.book-button:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 36px rgba(70,90,180,0.22); }

/* Responsive size on mobile */
@media (max-width: 700px){
  .book-button{ width: 72px; height:72px; right:20px; bottom:20px; border-radius:18px; }
  .book-button .book-icon svg{ width:24px; height:24px; }
}

.book-button-image{
  width: 34px;
  height: 34px;
  object-fit: contain;
  pointer-events: none; /* important so clicks go to button */
  user-select: none;
}

/* Bigger image on mobile */
@media (max-width: 700px){
  .book-button-image{
    width: 40px;
    height: 40px;
  }
}

/* Tooltip */
.book-button[data-tooltip]:after{
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 12px);
  right: 50%;
  transform: translateX(50%) translateY(6px);
  background: rgba(20,20,30,0.95);
  color: #fff;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: .9rem;
  white-space: nowrap;
  opacity: 0;
  pointer-events:none;
  transition: opacity .18s ease, transform .18s cubic-bezier(.2,.9,.2,1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.book-button:hover[data-tooltip]:after,
.book-button.show-tooltip[data-tooltip]:after{
  opacity: 1;
  transform: translateX(50%) translateY(0);
}

/* Modal / panel */
.book-modal{ position: fixed; inset:0; z-index:1190; display:none; align-items:center; justify-content:center; }
.book-modal[aria-hidden="false"]{ display:flex; }
.book-backdrop{ position:absolute; inset:0; background: rgba(10,12,18,0.56); backdrop-filter: blur(6px); transition: opacity .25s ease; opacity:1; }
.book-panel{
  position:relative;
  z-index:2;
  width: min(900px, 92%);
  max-width: 900px;
  margin: 18px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(248,248,252,0.98));
  box-shadow: 0 18px 60px rgba(10,12,30,0.35);
  transform: translateY(20px) scale(.98);
  transition: transform .28s cubic-bezier(.2,.9,.2,1), opacity .22s;
  overflow: hidden;
}
.book-modal[aria-hidden="false"] .book-panel{ transform: translateY(0) scale(1); }

.book-close{
  position:absolute;
  right:12px;
  top:8px;
  border:none;
  background:transparent;
  font-size:28px;
  line-height:1;
  color:#333;
  cursor:pointer;
  padding:8px;
  border-radius:8px;
  transition: background .12s;
}
.book-close:hover{ background: rgba(0,0,0,0.06); }

.book-content{
  display:flex;
  gap:22px;
  padding:26px;
  align-items:flex-start;
}

.book-cover{
  flex: 0 0 auto;
  width: 40%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.a4-portrait{
  width:100%;
  aspect-ratio: 210 / 297; /* portrait A4 (width/height) */
  background: linear-gradient(180deg,#fff,#fafafa);
  border-radius:8px;
  border: 1px solid rgba(20,20,30,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow: 0 6px 20px rgba(10,12,30,0.06) inset;
}
.a4-portrait img{ width:100%; height:100%; object-fit:cover; display:block; }

.book-meta{ flex:1 1 auto; min-width:0; }
.book-meta h2{ margin:0 0 8px 0; font-size:1.15rem; }
.book-desc{ margin:0 0 18px 0; color:#444; line-height:1.45; max-height:6.6em; overflow:hidden; }

.book-actions{ display:flex; gap:12px; align-items:center; }

.buy-button{
  display:inline-block;
  padding:12px 18px;
  background: linear-gradient(90deg,#ff7cac,#ffb86b);
  color:#111;
  font-weight:700;
  text-decoration:none;
  border-radius:10px;
  box-shadow: 0 8px 24px rgba(255,120,147,0.16);
  transition: transform .14s ease, box-shadow .14s ease;
}
.buy-button:active{ transform: translateY(1px) scale(.995); }
.buy-button:hover{ transform: translateY(-3px); box-shadow: 0 18px 44px rgba(255,120,147,0.18); }

/* Responsive: stack vertically on small screens and full-width modal */
@media (max-width: 700px){
  .book-panel{ width:100%; height:100%; max-width:100%; border-radius:0; margin:0; }
  .book-content{ flex-direction:column; padding:18px; gap:14px; }
  .book-cover{ width:100%; }
  .a4-portrait{ width: 100%; }
  .book-close{ right:12px; top:14px; }
}

</style>
</head>
<body>

  <!-- local background video -->
  <div id="video-bg" aria-hidden="true">
    <video id="bg-video" src="video.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>

  <div class="frame"><div class="frame__title"><span id="rotating-title" class="rotating-title" aria-live="polite" dir="auto">رسائل الأمل</span></div></div>
  
  <!-- Start Overlay -->
  <div id="start-overlay">
    <div class="start-icon">
      <!-- 4-way arrow icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width:100%;height:100%;">
        <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M19 9l3 3-3 3M9 19l3 3 3-3M2 12h20M12 2v20"></path>
      </svg>
    </div>
    <div class="start-text">Drag to Explore</div>
  </div>

  <div id="grid-container"></div>

  <div class="focus-overlay" id="focus-overlay" aria-hidden="true">
    <button class="focus-close" id="focus-close">CLOSE</button>
    <div id="focus-inner" aria-hidden="true"></div>
  </div>

<script>
/* ================= CONFIG ================= */
/* images: images/02.jpg .. images/64.jpg (adjust if needed) */
const IMAGES = [];
for (let i = 2; i <= 64; i++) IMAGES.push(String(i).padStart(2,'0') + '.jpg');

const CHUNK_SIZE = 4500;
const BASE_LONG_EDGE = 320;
const SIZE_JITTER = 0.10; // small size variation

/* Density control via min-dist multiplier: */
function getMinDistMultiplier(winW){
  if (winW < 600) return 2.0;    // mobile: sparse
  if (winW < 1200) return 1.6;   // tablet / small desktop
  return 1.35;                   // large desktop (still sparse)
}

/* Poisson-disc attempts (k) */
const POISSON_K = 30;

/* ================= Poisson-disc sampler (Bridson) ================= */
function poissonDisc(width, height, minDist, k=POISSON_K){
  const cellSize = minDist / Math.SQRT2;
  const gridW = Math.ceil(width / cellSize);
  const gridH = Math.ceil(height / cellSize);
  const grid = new Array(gridW * gridH).fill(null);
  const samples = [];
  const active = [];

  function gridIndex(x,y){
    return x + y * gridW;
  }

  function insertSample(sx, sy){
    const s = {x: sx, y: sy};
    samples.push(s);
    active.push(s);
    const gx = Math.floor(sx / cellSize);
    const gy = Math.floor(sy / cellSize);
    grid[gridIndex(gx,gy)] = s;
  }

  // start with a random seed
  insertSample(Math.random() * width, Math.random() * height);

  while (active.length){
    const idx = Math.floor(Math.random() * active.length);
    const s = active[idx];
    let placed = false;
    for (let i=0;i<k;i++){
      const a = Math.random() * Math.PI * 2;
      const r = minDist * (1 + Math.random());
      const nx = s.x + Math.cos(a) * r;
      const ny = s.y + Math.sin(a) * r;
      if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;

      const gx = Math.floor(nx / cellSize);
      const gy = Math.floor(ny / cellSize);

      let ok = true;
      const startX = Math.max(0, gx - 2);
      const endX = Math.min(gridW - 1, gx + 2);
      const startY = Math.max(0, gy - 2);
      const endY = Math.min(gridH - 1, gy + 2);
      for (let yy = startY; yy <= endY && ok; yy++){
        for (let xx = startX; xx <= endX; xx++){
          const neighbor = grid[gridIndex(xx,yy)];
          if (!neighbor) continue;
          const dx = neighbor.x - nx;
          const dy = neighbor.y - ny;
          if (dx*dx + dy*dy < minDist*minDist) { ok = false; break; }
        }
      }
      if (ok){
        insertSample(nx, ny);
        placed = true;
        break;
      }
    }
    if (!placed) active.splice(idx, 1);
  }

  return samples;
}

/* ================= GALLERY CLASS ================= */
class Gallery {
  constructor(){
    this.container = document.getElementById('grid-container');
    this.focusOverlay = document.getElementById('focus-overlay');
    this.focusInner = document.getElementById('focus-inner');
    this.focusClose = document.getElementById('focus-close');

    this.win = { w: innerWidth, h: innerHeight };
    this.pos = { current: {x:0,y:0}, target: {x:0,y:0} };
    this.mouse = { x:0.5, y:0.5, lerpX:0.5, lerpY:0.5 };
    this.drag = { active: false, start: {x:0,y:0}, last: {x:0,y:0} };

    // Zoom & Pan state for Focus Mode
    this.focusState = {
      zoom: 1,
      pan: {x:0, y:0},
      isPinching: false,
      startDist: 0,
      startZoom: 1,
      startPan: {x:0, y:0},
      pointerStart: {x:0, y:0}
    };

    this.items = [];
    this.samples = [];
    this.minDist = 0;
    this.isFocused = false;
    
    // Initial State Variables
    this.scale = 0.85; 
    this.gridSize = CHUNK_SIZE * this.scale;

    this.rebuild();
    this.onResize(); 
    this.addEvents();
    this.loop();
  }

  rebuild(){
    // clear
    this.container.innerHTML = '';
    this.items.length = 0;

    // compute min-dist (spacing) based on viewport width
    const mult = getMinDistMultiplier(this.win.w);
    this.minDist = Math.round(BASE_LONG_EDGE * mult);

    // generate Poisson-disc samples for chunk area
    const samples = poissonDisc(CHUNK_SIZE, CHUNK_SIZE, this.minDist, POISSON_K);

    // Fallback if sampler fails
    const minExpected = Math.max(12, Math.round(IMAGES.length * 0.35));
    if (samples.length < minExpected){
      const cols = Math.max(4, Math.ceil(Math.sqrt(minExpected)));
      const rows = cols;
      const arr = [];
      for (let r=0;r<rows;r++){
        for (let c=0;c<cols;c++){
          const cellW = CHUNK_SIZE / cols;
          const cellH = CHUNK_SIZE / rows;
          arr.push({
            x: (c + Math.random()*0.75) * cellW,
            y: (r + Math.random()*0.75) * cellH
          });
        }
      }
      while (arr.length < minExpected) arr.push({x:Math.random()*CHUNK_SIZE,y:Math.random()*CHUNK_SIZE});
      this.samples = arr;
    } else {
      this.samples = samples;
    }

    // 2x2 Tiling Offsets
    const offsets = [
      {x:0,y:0},
      {x:CHUNK_SIZE,y:0},
      {x:0,y:CHUNK_SIZE},
      {x:CHUNK_SIZE,y:CHUNK_SIZE}
    ];

    const shuffled = [...IMAGES].sort(()=>Math.random()-0.5);

    for (let o = 0; o < offsets.length; o++){
      const off = offsets[o];
      for (let s = 0; s < this.samples.length; s++){
        const pt = this.samples[s];
        const filename = shuffled[(s + o) % shuffled.length]; 
        const el = document.createElement('div');
        el.className = 'item';
        const wrapper = document.createElement('div');
        wrapper.className = 'item-wrapper';
        const img = document.createElement('img');
        img.className = 'item-image';
        img.alt = filename;
        img.decoding = 'async';
        img.loading = 'lazy';
        img.dataset.src = `images/${filename}`;
        img.draggable = false; // prevent browser drag ghost
        img.addEventListener('dragstart', e => e.preventDefault());

        wrapper.appendChild(img);
        el.appendChild(wrapper);
        this.container.appendChild(el);

        const jitter = 1 + (Math.random()*2 - 1) * SIZE_JITTER;
        const allowedLong = Math.max(72, Math.round(this.minDist * 0.78));
        const desiredLong = Math.round(BASE_LONG_EDGE * jitter);
        const finalLong = Math.min(desiredLong, allowedLong);

        const item = {
          el, wrapper, img,
          x: pt.x + off.x + (Math.random()*8 - 4),
          y: pt.y + off.y + (Math.random()*8 - 4),
          baseLong: finalLong,
          w: Math.round(finalLong),
          h: Math.round(finalLong * 0.7),
          aspect: null,
          visible: false,
          loaded: false,
          ex: 0, ey: 0,
          pSpeed: 0.02 + Math.random()*0.06
        };

        img.onload = () => {
          if (!img.naturalWidth || !img.naturalHeight) return;
          const ar = img.naturalWidth / img.naturalHeight;
          item.aspect = ar;
          const longEdge = Math.min(item.baseLong, Math.max(64, item.baseLong));
          if (ar >= 1){
            item.w = Math.round(longEdge);
            item.h = Math.round(longEdge / ar);
          } else {
            item.h = Math.round(longEdge);
            item.w = Math.round(longEdge * ar);
          }
          item.el.style.width = item.w + 'px';
          item.el.style.height = item.h + 'px';
          item.img.classList.add('loaded'); 
        };
        
        // Handle cached images immediately
        if(img.complete && img.naturalWidth) img.onload();

        this.items.push(item);
      }
    }
  }

  onResize(){
    this.win = { w: innerWidth, h: innerHeight };
    const prevMin = this.minDist || 0;
    const mult = getMinDistMultiplier(this.win.w);
    const newMin = Math.round(BASE_LONG_EDGE * mult);
    
    // Rebuild if density requirements change drastically
    if (Math.abs(newMin - prevMin) > 6 || !this.minDist){
      this.rebuild();
    }

    this.scale = this.win.w < 768 ? 0.56 : 0.85;
    this.gridSize = CHUNK_SIZE * this.scale;

    this.items.forEach(item => {
      const scaledW = Math.max(56, Math.round((item.w || item.baseLong) * this.scale));
      const scaledH = Math.max(56, Math.round((item.h || (item.baseLong*0.7)) * this.scale));
      item.el.style.width = scaledW + 'px';
      item.el.style.height = scaledH + 'px';
    });
  }

  focusItem(item){
    if (this.isFocused || this.drag.active) return;
    this.isFocused = true;
    this.activeItem = item;
    
    // Reset Zoom State
    this.focusState.zoom = 1;
    this.focusState.pan = {x:0, y:0};

    this.focusInner.innerHTML = '';
    const fi = document.createElement('img');
    fi.className = 'focus-img';
    fi.src = item.img.dataset.src || item.img.src;
    fi.draggable = false;
    fi.addEventListener('dragstart', e => e.preventDefault());
    this.focusInner.appendChild(fi);
    this.focusOverlay.classList.add('active');
  }

  unfocusItem(){
    this.focusOverlay.classList.remove('active');
    this.focusInner.innerHTML = '';
    this.isFocused = false;
    this.activeItem = null;
  }

  loop(){
    requestAnimationFrame(()=>this.loop());

    if (this.isFocused) {
      // Render Focus Zoom
      const img = this.focusInner.querySelector('img');
      if (img) {
        const { pan, zoom } = this.focusState;
        img.style.transform = `translate3d(${pan.x}px, ${pan.y}px, 0) scale(${zoom})`;
      }
      return; 
    }

    // Normal Gallery Loop
    this.pos.current.x += (this.pos.target.x - this.pos.current.x) * 0.07;
    this.pos.current.y += (this.pos.target.y - this.pos.current.y) * 0.07;
    this.mouse.lerpX += (this.mouse.x - this.mouse.lerpX) * 0.03;
    this.mouse.lerpY += (this.mouse.y - this.mouse.lerpY) * 0.03;

    const parX = (this.mouse.lerpX - 0.5) * this.win.w * 0.12;
    const parY = (this.mouse.lerpY - 0.5) * this.win.h * 0.12;
    
    const viewBufferX = Math.max(600, this.win.w * 0.8);
    const viewBufferY = Math.max(600, this.win.h * 0.8);

    if (!this.gridSize || isNaN(this.gridSize)) this.gridSize = CHUNK_SIZE * 0.85;

    for (let i=0;i<this.items.length;i++){
      const item = this.items[i];
      const iW = parseFloat(item.el.style.width) || 100;
      const iH = parseFloat(item.el.style.height) || 100;

      let x = (item.x * this.scale) + this.pos.current.x + item.ex;
      let y = (item.y * this.scale) + this.pos.current.y + item.ey;

      const finalX = x + (parX * item.pSpeed);
      const finalY = y + (parY * item.pSpeed);

      if (finalX < -iW - viewBufferX) {
        item.ex += this.gridSize * 2;
      } else if (finalX > this.win.w + viewBufferX) {
        item.ex -= this.gridSize * 2;
      }

      if (finalY < -iH - viewBufferY) {
        item.ey += this.gridSize * 2;
      } else if (finalY > this.win.h + viewBufferY) {
        item.ey -= this.gridSize * 2;
      }

      const renderX = (item.x * this.scale) + this.pos.current.x + item.ex + (parX * item.pSpeed);
      const renderY = (item.y * this.scale) + this.pos.current.y + item.ey + (parY * item.pSpeed);

      const isVisible = (
        renderX > -iW - 200 &&
        renderX < this.win.w + 200 &&
        renderY > -iH - 200 &&
        renderY < this.win.h + 200
      );

      if (isVisible){
        if (!item.visible){
          item.visible = true;
          item.el.classList.add('is-visible');
          if (!item.img.src && item.img.dataset.src){
             item.img.src = item.img.dataset.src;
          }
        }
        item.el.style.transform = `translate3d(${renderX.toFixed(1)}px, ${renderY.toFixed(1)}px, 0)`;
        item.el.style.zIndex = Math.round(renderY + i);
      } else {
        if (item.visible){
          item.visible = false;
          item.el.classList.remove('is-visible');
        }
      }
    }
  }

  addEvents(){
    const updateMouse = (x,y) => { this.mouse.x = x / this.win.w; this.mouse.y = y / this.win.h; };

    // --- KEYBOARD ---
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') this.unfocusItem();
    });

    // --- MOUSE WHEEL (Zoom when focused, Pan when not) ---
    window.addEventListener('wheel', e => {
      if (this.isFocused) {
        // Zoom logic
        e.preventDefault();
        const delta = e.deltaY * -0.0015;
        const newZoom = Math.min(2, Math.max(1, this.focusState.zoom + delta));
        this.focusState.zoom = newZoom;
        if (newZoom === 1) this.focusState.pan = {x:0, y:0};
        return;
      }
      this.pos.target.x -= e.deltaX * 1.0;
      this.pos.target.y -= e.deltaY * 1.0;
    }, { passive:false });

    // --- MOUSE DRAG ---
    window.addEventListener('mousedown', e => {
      if (this.isFocused) {
        // Setup Pan for focused image
        if (this.focusState.zoom > 1) {
          this.drag.active = true;
          this.focusState.pointerStart = {x:e.clientX, y:e.clientY};
          this.focusState.startPan = { ...this.focusState.pan };
        }
        return;
      }
      this.drag.active = true;
      this.drag.start = { x: e.clientX, y: e.clientY };
      this.drag.last = { ...this.pos.target };
      document.body.classList.add('dragging');
    });

    window.addEventListener('mousemove', e => {
      if (this.isFocused) {
        if (this.drag.active && this.focusState.zoom > 1) {
          const dx = e.clientX - this.focusState.pointerStart.x;
          const dy = e.clientY - this.focusState.pointerStart.y;
          this.focusState.pan.x = this.focusState.startPan.x + dx;
          this.focusState.pan.y = this.focusState.startPan.y + dy;
        }
        return;
      }
      updateMouse(e.clientX, e.clientY);
      if (this.drag.active){
        const dx = e.clientX - this.drag.start.x;
        const dy = e.clientY - this.drag.start.y;
        this.pos.target.x = this.drag.last.x + dx * 1.2;
        this.pos.target.y = this.drag.last.y + dy * 1.2;
      }
    });

    window.addEventListener('mouseup', e => {
      if (this.isFocused) {
        this.drag.active = false;
        return;
      }
      if (!this.drag.active) return;
      this.drag.active = false;
      document.body.classList.remove('dragging');
      // TAP DETECTION: Increased threshold to 40px for mobile reliability
      const endX = e.clientX;
      const endY = e.clientY;
      const dist = Math.hypot(endX - this.drag.start.x, endY - this.drag.start.y);
      if (dist < 40){
        const elem = document.elementFromPoint(endX, endY);
        const hit = elem ? elem.closest('.item') : null;
        if (hit){
          const it = this.items.find(it => it.el === hit);
          if (it) this.focusItem(it);
        }
      }
    });

    // --- TOUCH EVENTS ---
    window.addEventListener('touchstart', e => {
      if (this.isFocused) {
        if (e.touches.length === 2) {
          // PINCH START
          this.focusState.isPinching = true;
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          this.focusState.startDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          this.focusState.startZoom = this.focusState.zoom;
        } else if (e.touches.length === 1 && this.focusState.zoom > 1) {
          // PAN START
          this.drag.active = true;
          const t = e.touches[0];
          this.focusState.pointerStart = {x:t.clientX, y:t.clientY};
          this.focusState.startPan = { ...this.focusState.pan };
        }
        return;
      }
      const t = e.touches[0];
      this.drag.active = true;
      this.drag.start = { x: t.clientX, y: t.clientY };
      this.drag.last = { ...this.pos.target };
      updateMouse(t.clientX, t.clientY);
    }, { passive:false });

    window.addEventListener('touchmove', e => {
      if (this.isFocused) {
        e.preventDefault(); // Prevent scrolling
        if (this.focusState.isPinching && e.touches.length === 2) {
          // PINCH MOVE
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
          if (this.focusState.startDist > 0) {
            const scale = currentDist / this.focusState.startDist;
            this.focusState.zoom = Math.min(2, Math.max(1, this.focusState.startZoom * scale));
            if (this.focusState.zoom === 1) this.focusState.pan = {x:0, y:0};
          }
        } else if (this.drag.active && e.touches.length === 1 && this.focusState.zoom > 1) {
          // PAN MOVE
          const t = e.touches[0];
          const dx = t.clientX - this.focusState.pointerStart.x;
          const dy = t.clientY - this.focusState.pointerStart.y;
          this.focusState.pan.x = this.focusState.startPan.x + dx;
          this.focusState.pan.y = this.focusState.startPan.y + dy;
        }
        return;
      }
      e.preventDefault(); // Prevent scrolling on body
      const t = e.touches[0];
      updateMouse(t.clientX, t.clientY);
      if (this.drag.active){
        const dx = t.clientX - this.drag.start.x;
        const dy = t.clientY - this.drag.start.y;
        this.pos.target.x = this.drag.last.x + dx * 1.4;
        this.pos.target.y = this.drag.last.y + dy * 1.4;
      }
    }, { passive:false });

    window.addEventListener('touchend', e => {
      if (this.isFocused) {
        this.drag.active = false;
        this.focusState.isPinching = false;
        return;
      }
      if (!this.drag.active) return;
      this.drag.active = false;
      const t = e.changedTouches[0];
      // TAP DETECTION: Increased threshold to 40px for mobile reliability
      const endX = e.clientX;
      const endY = e.clientY;
      const dist = Math.hypot(endX - this.drag.start.x, endY - this.drag.start.y);
      if (dist < 40){
        const elem = document.elementFromPoint(endX, endY);
        const hit = elem ? elem.closest('.item') : null;
        if (hit){
          const it = this.items.find(it => it.el === hit);
          if (it) this.focusItem(it);
        }
      }
    });

    window.addEventListener('resize', () => {
      clearTimeout(this._resizeDeb);
      this._resizeDeb = setTimeout(()=> this.onResize(), 120);
    });

    // overlay close
    this.focusClose.addEventListener('click', () => this.unfocusItem());
    // Only close on background click if not dragging/pinching
    this.focusOverlay.addEventListener('click', (e) => {
      if (this.focusState.zoom > 1.05) return; // Don't close if zoomed in (user might be panning)
      if (e.target === this.focusOverlay || e.target === this.focusInner) this.unfocusItem();
    });
  }
}

<script>
(function(){
  // Strings to rotate
  const texts = [
    { txt: "رسائل الأمل", lang: "ar", dir: "rtl" },
    { txt: "Messages of Hope", lang: "en", dir: "ltr" }
  ];
  const displayDuration = 5000; // milliseconds per full cycle (as requested)
  const typeSpeed = 60; // ms per char typing
  const deleteSpeed = 40; // ms per char deleting

  function createTarget() {
    const el = document.getElementById('rotating-title');
    if (!el) return null;
    // clear and setup inner spans
    el.innerHTML = '<span class="text-inner" aria-hidden="true"></span><span class="caret" aria-hidden="true">|</span>';
    el.setAttribute('aria-live','polite');
    return el;
  }

  function setTextDirection(el, dir) {
    if (!el) return;
    el.dir = dir;
    if (dir === 'rtl') {
      el.style.direction = 'rtl';
      el.style.textAlign = 'right';
    } else {
      el.style.direction = 'ltr';
      el.style.textAlign = 'left';
    }
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function typeString(span, str, speed){
    for (let i=0;i<str.length;i++){
      span.textContent += str.charAt(i);
      await sleep(speed);
    }
  }

  async function deleteString(span, speed){
    while (span.textContent.length > 0){
      span.textContent = span.textContent.slice(0, -1);
      await sleep(speed);
    }
  }

  async function cycle(el){
    const inner = el.querySelector('.text-inner');
    const caret = el.querySelector('.caret');
    let idx = 0;
    while(true){
      const item = texts[idx % texts.length];
      // set direction and lang attribute
      el.lang = item.lang;
      setTextDirection(el, item.dir);

      // compute durations so that total time per item ~ displayDuration
      const typingTime = Math.max(0, item.txt.length * typeSpeed);
      const deletingTime = Math.max(0, item.txt.length * deleteSpeed);
      // ensure there is at least 300ms hold time
      let holdTime = displayDuration - typingTime - deletingTime;
      if (holdTime < 300) holdTime = 300;

      // type
      inner.textContent = '';
      await typeString(inner, item.txt, typeSpeed);

      // hold
      await sleep(holdTime);

      // delete quickly (before next cycle)
      await deleteString(inner, deleteSpeed);

      // small pause before next
      await sleep(100);

      idx++;
    }
  }

  // Initialize when DOM ready
  function init(){
    const el = createTarget();
    if (!el) return;
    // start cycling but wait until visible for better UX
    // ensure caret is visible (caret CSS handles blinking)
    cycle(el).catch(e => console.error("Typewriter error", e));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<script>
(function(){
  const btn = document.getElementById('book-button');
  const modal = document.getElementById('book-modal');
  const backdrop = modal ? modal.querySelector('.book-backdrop') : null;
  const closeBtn = modal ? modal.querySelector('.book-close') : null;
  const buyBtn = document.getElementById('buy-button');

  function openModal(){
    if (!modal) return;
    modal.setAttribute('aria-hidden','false');
    btn.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
    // focus the close button for keyboard users
    setTimeout(()=> closeBtn && closeBtn.focus(), 220);
  }

  function closeModal(){
    if (!modal) return;
    modal.setAttribute('aria-hidden','true');
    btn.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
    btn.focus();
  }

  function toggleModal(){ if (modal.getAttribute('aria-hidden') === 'false') closeModal(); else openModal(); }

  if (btn){
    btn.addEventListener('click', (e)=> { e.preventDefault(); toggleModal(); });
    btn.addEventListener('keydown', (e)=> { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleModal(); } });
  }
  if (backdrop) backdrop.addEventListener('click', closeModal);
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  // close on ESC
  document.addEventListener('keydown', (e)=> { if (e.key === 'Escape') closeModal(); });

  // ensure images inside modal are not draggable (consistent with gallery behaviour)
  const modalImg = modal ? modal.querySelector('img') : null;
  if (modalImg){ modalImg.draggable = false; modalImg.addEventListener('dragstart', e => e.preventDefault()); }

  // Tooltip display: show on hover via CSS; also show once for 7s after the initial overlay is removed.
  function showTooltipTemporarily(ms=7000){
    if (!btn) return;
    btn.classList.add('show-tooltip');
    setTimeout(()=> btn.classList.remove('show-tooltip'), ms);
  }

  // Wait until the initial start-overlay (if present) is hidden/removed, then show tooltip for 7s.
  function waitForOverlayThenShow(){
    const checkInterval = 200;
    const maxChecks = 60; // ~12 seconds max
    let checks = 0;
    const overlay = document.getElementById('start-overlay');
    if (!overlay){
      // if no overlay present, show after 800ms
      setTimeout(()=> showTooltipTemporarily(7000), 800);
      return;
    }
    const id = setInterval(()=>{
      checks++;
      // consider overlay hidden if style display is none or it has attribute 'data-hidden' or has no offsetParent
      const computed = window.getComputedStyle(overlay);
      const hidden = computed && (computed.display === 'none' || computed.visibility === 'hidden' || overlay.offsetParent === null);
      if (hidden || checks > maxChecks){
        clearInterval(id);
        // small delay after overlay removed to improve UX
        setTimeout(()=> showTooltipTemporarily(7000), 450);
      }
    }, checkInterval);
  }

  // Kick off waiting behavior
  waitForOverlayThenShow();

  // Accessibility: trap focus inside modal when open (basic)
  document.addEventListener('focus', function(ev){
    if (modal && modal.getAttribute('aria-hidden') === 'false'){
      if (!modal.contains(ev.target)){
        ev.stopPropagation();
        closeBtn && closeBtn.focus();
      }
    }
  }, true);

})();
</script>
